# ==============================================================================
# 1C:Specter (UIxUnit) — GitLab CI/CD Pipeline Template
# ==============================================================================
# Данный шаблон предназначен для интегрирования headless-запуска E2E-тестов 1С
# в ваш CI/CD пайплайн GitLab с отображением отчетов в Merge Request UI.
#
# Порядок подключения:
# 1. Скопируйте файл tools/ci/specter-cli.py в репозиторий вашего 1С-проекта.
# 2. Перенесите содержимое этого файла в `.gitlab-ci.yml` вашего проекта.
# 3. Настройте CI/CD Переменные в GitLab (Settings -> CI/CD -> Variables):
#    - SPECTER_CLIENT_PATH: путь к 1cv8c (например, "C:\Program Files\1cv8\8.3.25.1234\bin\1cv8c.exe" или "/opt/1C/v8.3/x86_64/1cv8c")
#    - SPECTER_IB_CONN: строка подключения ИБ (например, "File=\"C:\1C\Bases\DemoDB\"" или "Srvr=\"1c-app-srv\";Ref=\"test_base\";")
#    - SPECTER_USER: имя пользователя 1С
#    - SPECTER_PASSWORD: пароль пользователя 1С
# ==============================================================================

stages:
  - test

variables:
  SPECTER_OUT_DIR: "${CI_PROJECT_DIR}/specter-exchange"
  SPECTER_CLIENT_PATH: "1cv8c"
  SPECTER_IB_CONN: "File=\"/var/1c/bases/test_db\""
  SPECTER_USER: "Administrator"
  SPECTER_PASSWORD: ""
  SPECTER_TIMEOUT: "300"
  SPECTER_MODULE: ""

e2e-tests-1c:
  stage: test
  tags:
    - 1c-runner  # Тэг вашeго GitLab Runner с установленным тонким клиентом 1С
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - mkdir -p "${SPECTER_OUT_DIR}"
  script:
    - python3 tools/ci/specter-cli.py --out-dir "${SPECTER_OUT_DIR}" --client-path "${SPECTER_CLIENT_PATH}" --ib-conn "${SPECTER_IB_CONN}" --user "${SPECTER_USER}" --password "${SPECTER_PASSWORD}" --timeout "${SPECTER_TIMEOUT}" ${SPECTER_MODULE:+--module "${SPECTER_MODULE}"} --report-path "junit-report.xml"
  artifacts:
    when: always
    paths:
      - junit-report.xml
      - "${SPECTER_OUT_DIR}/"
    reports:
      junit: junit-report.xml
    expire_in: 1 week
