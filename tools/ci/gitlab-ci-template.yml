# GitLab CI Pipeline Template for 1C:Specter Parallel E2E UI Tests
# Copy this template or include it in your 1C project's .gitlab-ci.yml

stages:
  - test

e2e-tests-1c:
  stage: test
  image: python:3.11-slim
  tags:
    - 1c-windows-runner  # Adjust to your Windows / Linux runner tag with 1C Thin Client installed
  variables:
    SPECTER_CLIENT_PATH: "1cv8c"
    SPECTER_IB_CONN: "File=\"/var/lib/1c/infobases/test_ib\""
    WORKERS_COUNT: "4"
  script:
    - echo "Initializing 1C:Specter Parallel Headless Test Execution..."
    - python tools/ci/specter-cli.py \
        --workers $WORKERS_COUNT \
        --client-path "$SPECTER_CLIENT_PATH" \
        --ib-conn "$SPECTER_IB_CONN" \
        --timeout 600 \
        --report-path junit-report.xml
  artifacts:
    name: "specter-test-reports"
    when: always
    expire_in: 30 days
    reports:
      junit: junit-report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: manual
