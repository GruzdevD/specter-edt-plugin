name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Плагин компилится к Java 17 (BREE JavaSE-17) под EDT 2025.2 / Eclipse 4.30;
      # Tycho 4.x работает на JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      - name: Maven build (Tycho)
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" clean verify --batch-mode --no-transfer-progress -T 1C

      - name: Upload update-site artifact
        uses: actions/upload-artifact@v7
        with:
          name: uitp-edt-plugin-update-site
          path: repositories/ru.ozon.uitp.e2e.repository/target/repository
