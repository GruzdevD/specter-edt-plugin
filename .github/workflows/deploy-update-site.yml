name: Deploy Update Site

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Extract version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch: latest published release tag
            VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName | ltrimstr("v")')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          gh release download "v${{ steps.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "UITP-EDT.v*.zip" \
            --output release.zip
          unzip -q release.zip -d _site/

      - name: Create index.html
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head><title>UITP E2E EDT Plugin - Update Site</title></head>
          <body>
            <h1>UITP E2E EDT Plugin - Update Site</h1>
            <p>Current version: <strong>${VERSION}</strong></p>
            <p>Use this URL in EDT: <strong>Help &rarr; Install New Software...</strong></p>
            <pre>https://gruzdevd.github.io/uitp-edt-plugin/</pre>
            <p><a href="https://github.com/GruzdevD/uitp-edt-plugin">GitHub Repository</a></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
