name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 0.3.1)'
        required: false
        default: '0.3.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        run: |
          set -euo pipefail
          TYCHO=$(sed -n 's|.*<tycho.version>\(.*\)</tycho.version>.*|\1|p' pom.xml)
          test -n "$TYCHO"
          echo "tycho-versions-plugin: $TYCHO"
          mvn "org.eclipse.tycho:tycho-versions-plugin:$TYCHO:set-version" \
            -DnewVersion=${{ steps.version.outputs.version }} \
            --batch-mode --no-transfer-progress

      - name: Maven build (Tycho)
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" clean verify --batch-mode --no-transfer-progress -T 1C

      - name: Package update-site archive
        run: |
          cd repositories/ru.ozon.uitp.e2e.repository/target/repository
          zip -r "$GITHUB_WORKSPACE/UITP-EDT.v${{ steps.version.outputs.version }}.zip" .

      - name: Package extension archive (СП_Тестирование)
        # Расширение 1С СП_Тестирование (BSL-мост + движок действий) распространяется вместе с
        # плагином. Единая версия: <version> в Configuration.mdo расширения = версия
        # плагина и тега v*. Исходник-источник живёт в этом репо (extension/СП_Тестирование/src).
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="$GITHUB_WORKSPACE/.stage/СП_Тестирование"
          mkdir -p "$STAGE"
          cp -R "$GITHUB_WORKSPACE/extension/СП_Тестирование/src" "$STAGE/src"
          sed -i "s|<version>[^<]*</version>|<version>${VERSION}</version>|" \
            "$STAGE/src/Configuration/Configuration.mdo"
          (cd "$STAGE" && zip -q -r "$GITHUB_WORKSPACE/UITP-EXTENSION.СП_Тестирование.v${VERSION}.zip" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: UITP-EDT v${{ steps.version.outputs.version }}
          body: |
            **Specter** — EDT-плагин UI-тестирования 1С: панели «Тесты» / «Результаты»,
            запуск тестов прямо из редактора кода BSL через маркеры на линейке (Gutter)
            и BSL-мост на реальном UI 1С (без .epf, видео и скриншотов).

            Установка через UI EDT: **Help → Install New Software → Work with:**
            `https://gruzdevd.github.io/specter-edt-plugin/` → «Next» → Next → «Restart Now».

            В дистрибутив входит BSL-расширение **СП_Тестирование** (`UITP-EXTENSION.СП_Тестирование.v*.zip`):
            живой мост команд на реальном UI 1С + библиотеки действий и ожиданий (см. `extension/СП_Тестирование/`).
          files: |
            UITP-EDT.v*.zip
            UITP-EXTENSION.СП_Тестирование.v*.zip
